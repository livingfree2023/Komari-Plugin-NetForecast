<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetForecast - 全节点网络流量预测与限额预警</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --inbound: #6366f1;
      --outbound: #10b981;
      --cumulative: #f59e0b;
      --forecast-line: #fb923c;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.16);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.16);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.16);
      --neutral-badge: rgba(148, 163, 184, 0.15);
      --mode-tag-bg: rgba(99, 102, 241, 0.12);
      --mode-tag-border: rgba(99, 102, 241, 0.3);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1340px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* 顶部控制与状态栏 */
    .header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      padding: 18px 24px;
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .title-icon {
      font-size: 26px;
      background: rgba(99, 102, 241, 0.25);
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.4);
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.2);
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* 动态筛选药丸按钮栏 */
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.7);
      color: var(--text-muted);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .filter-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      color: #fff;
      transform: translateY(-1px);
    }

    .filter-btn.active.filter-all {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 2px 12px rgba(255, 255, 255, 0.1);
    }

    .filter-btn.active.filter-critical {
      background: var(--danger-bg);
      border-color: rgba(239, 68, 68, 0.7);
      color: #fca5a5;
      font-weight: 700;
      box-shadow: 0 2px 14px rgba(239, 68, 68, 0.35);
    }

    .filter-btn.active.filter-warning {
      background: var(--warning-bg);
      border-color: rgba(245, 158, 11, 0.7);
      color: #fde68a;
      font-weight: 700;
      box-shadow: 0 2px 14px rgba(245, 158, 11, 0.35);
    }

    .filter-btn.active.filter-safe {
      background: var(--success-bg);
      border-color: rgba(16, 185, 129, 0.7);
      color: #a7f3d0;
      font-weight: 700;
      box-shadow: 0 2px 14px rgba(16, 185, 129, 0.35);
    }

    .filter-btn.active.filter-no-quota {
      background: var(--neutral-badge);
      border-color: rgba(148, 163, 184, 0.5);
      color: #e2e8f0;
      font-weight: 700;
      box-shadow: 0 2px 12px rgba(148, 163, 184, 0.2);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-refresh {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .btn-refresh:hover {
      color: #fff;
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* 状态徽标 */
    .summary-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      border: 1px solid transparent;
    }

    .badge-critical {
      background: var(--danger-bg);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .badge-warning {
      background: var(--warning-bg);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .badge-safe {
      background: var(--success-bg);
      border-color: rgba(16, 185, 129, 0.3);
      color: #a7f3d0;
    }

    .badge-neutral {
      background: var(--neutral-badge);
      border-color: rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: var(--mode-tag-bg);
      border: 1px solid var(--mode-tag-border);
      color: #a5b4fc;
    }

    /* 节点设置按钮 */
    .node-edit-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .node-edit-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* 节点卡片列表 */
    .nodes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .node-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 18px;
      transition: all 0.25s ease;
    }

    .node-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
    }

    .node-card.hidden {
      display: none !important;
    }

    .node-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .node-title-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .node-name {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .node-quota-meta {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.7);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .node-alert-banner {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .node-alert-banner.critical {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .node-alert-banner.warning {
      background: var(--warning-bg);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .node-alert-banner strong {
      color: #fff;
    }

    .node-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .node-kpi-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .kpi-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: flex;
      justify-content: space-between;
    }

    .kpi-number {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .kpi-detail {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--inbound);
      border-radius: 3px;
    }

    .progress-bar-fill.critical {
      background: var(--danger);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
    }

    .progress-bar-fill.warning {
      background: var(--warning);
    }

    .chart-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chart-sub-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 11px;
      height: 11px;
      border-radius: 3px;
    }

    .legend-line {
      width: 16px;
      height: 3px;
      border-radius: 2px;
    }

    .legend-line.dashed {
      border-top: 2px dashed var(--forecast-line);
      height: 0;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 290px;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 10px;
      padding: 10px 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tooltip {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 12px;
      color: #fff;
      pointer-events: none;
      display: none;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      min-width: 185px;
    }

    .tooltip-title {
      font-weight: 600;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .empty-state {
      display: none;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* 弹出输入框 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      width: 90%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--inbound);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-secondary:hover {
      color: #fff;
      background: rgba(30, 41, 59, 0.9);
    }

    .btn-primary {
      background: var(--inbound);
      border: 1px solid var(--inbound);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #4f46e5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部总览与交互式筛选器 -->
    <header class="header-bar">
      <div class="title-group">
        <div class="title-icon">📊</div>
        <div>
          <h1>节点网络流量预测与限额预警 (NetForecast)</h1>
          <div class="subtitle">全节点 30 天每日增量柱状图 / 计费规则自适应累计 / 账单日耗尽推算（直连核心数据库）</div>
        </div>
      </div>
      <div class="header-actions">
        <!-- 动态交互式 Filter 按钮栏 -->
        <div class="filter-group" id="filterBar" role="tablist"></div>
        <button class="btn-refresh" id="btnRefresh" title="从核心数据库刷新">🔄 刷新</button>
      </div>
    </header>

    <!-- 所有节点图表列表容器 -->
    <main class="nodes-container" id="nodesContainer"></main>

    <!-- 筛选为空时的占位 -->
    <div class="empty-state" id="emptyState">
      🔍 没有找到符合当前筛选条件的节点
    </div>
  </div>

  <!-- 单节点限额配置弹出模态框 (直接写入 Komari 核心数据库) -->
  <div class="modal-overlay" id="nodeConfigModal">
    <div class="modal">
      <div class="modal-title">⚙️ 配置节点流量限额与统计规则</div>
      <div class="form-group">
        <label>目标节点</label>
        <input type="text" id="modalNodeName" readonly style="opacity:0.75;" />
      </div>
      <div class="form-group">
        <label>流量限额类型 (traffic_limit_type)</label>
        <select id="modalTrafficMode">
          <option value="sum">双向求和 (sum: Inbound + Outbound)</option>
          <option value="max">双向取大 (max: MAX(In, Out))</option>
          <option value="min">双向取小 (min: MIN(In, Out))</option>
          <option value="upload">仅计出站 (upload: 仅 Outbound)</option>
          <option value="download">仅计入站 (download: 仅 Inbound)</option>
        </select>
      </div>
      <div class="form-group">
        <label>每月流量限额 (GB，填 0 表示不设置限额)</label>
        <input type="number" id="modalQuotaGB" min="0" step="10" placeholder="例如 1000，填 0 表示不限额" />
      </div>
      <div class="form-group">
        <label>账单重置日 (同步自节点到期时间 expired_at)</label>
        <input type="text" id="modalResetDayInfo" readonly style="opacity:0.85; background:rgba(15,23,42,0.6);" />
        <div style="font-size:11px; color:var(--text-muted); margin-top:3px; line-height:1.4;">
          💡 流量重置周期由节点到期日决定；如需调整，请前往 Komari 节点管理设置该节点的到期时间。
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeNodeModal()">取消</button>
        <button class="btn-primary" id="btnSaveNodeModal" onclick="saveNodeModal()">保存并写入数据库</button>
      </div>
    </div>
  </div>

  <script>
    const GB = 1024 * 1024 * 1024;

    const THRESHOLD_MODES = {
      sum: {
        code: "sum",
        name: "双向求和 (SUM)",
        desc: "计费流量 = 入站 + 出站",
        badge: "双向求和 (In + Out)",
        lineLabel: "当月计费累计 (双向求和)"
      },
      max: {
        code: "max",
        name: "双向取大 (MAX)",
        desc: "计费流量 = MAX(入站, 出站)",
        badge: "双向取大 MAX(In, Out)",
        lineLabel: "当月计费累计 (取高者 MAX)"
      },
      min: {
        code: "min",
        name: "双向取小 (MIN)",
        desc: "计费流量 = MIN(入站, 出站)",
        badge: "双向取小 MIN(In, Out)",
        lineLabel: "当月计费累计 (取低者 MIN)"
      },
      upload: {
        code: "upload",
        name: "仅计出站 (UPLOAD)",
        desc: "计费流量 = 仅出站 (入站不计额度)",
        badge: "仅计出网 (Upload Only)",
        lineLabel: "当月计费累计 (仅出站)"
      },
      up: {
        code: "upload",
        name: "仅计出站 (UPLOAD)",
        desc: "计费流量 = 仅出站 (入站不计额度)",
        badge: "仅计出网 (Upload Only)",
        lineLabel: "当月计费累计 (仅出站)"
      },
      download: {
        code: "download",
        name: "仅计入站 (DOWNLOAD)",
        desc: "计费流量 = 仅入站 (出站不计额度)",
        badge: "仅计入网 (Download Only)",
        lineLabel: "当月计费累计 (仅入站)"
      },
      down: {
        code: "download",
        name: "仅计入站 (DOWNLOAD)",
        desc: "计费流量 = 仅入站 (出站不计额度)",
        badge: "仅计入网 (Download Only)",
        lineLabel: "当月计费累计 (仅入站)"
      }
    };

    function formatBytes(bytes, decimals = 2) {
      if (!bytes || bytes === 0) return "0 B";
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ["B", "KB", "MB", "GB", "TB", "PB"];
      const i = Math.floor(Math.log(Math.abs(bytes)) / Math.log(k));
      const idx = Math.min(i, sizes.length - 1);
      return parseFloat((bytes / Math.pow(k, idx)).toFixed(dm)) + " " + sizes[idx];
    }

    const state = {
      rawNodes: [],
      currentFilter: "ALL",
      editingNodeId: null
    };

    /**
     * 将从 Komari 核心接口 /api/records/load 返回的真实网络打点记录按日汇总为进出站流量增量
     * 绝不构造假数据，无打点的天数保持为 0
     */
    function aggregateDailyFromRecords(records) {
      if (!Array.isArray(records) || records.length === 0) return [];

      const dayGroups = {};
      records.forEach((r) => {
        if (!r.time) return;
        const dayStr = r.time.slice(0, 10);
        if (!dayGroups[dayStr]) dayGroups[dayStr] = [];
        dayGroups[dayStr].push(r);
      });

      const result = [];
      for (const dayStr of Object.keys(dayGroups)) {
        const list = dayGroups[dayStr];
        list.sort((a, b) => new Date(a.time).getTime() - new Date(b.time).getTime());

        let dayIn = 0;
        let dayOut = 0;

        const first = list[0];
        const last = list[list.length - 1];

        // 优先使用实际累计计数器的跨度差值（最精确）
        if (typeof last.net_total_up === "number" && typeof first.net_total_up === "number" && last.net_total_up >= first.net_total_up) {
          dayOut = last.net_total_up - first.net_total_up;
        } else {
          let sumOutRate = 0;
          list.forEach(item => { sumOutRate += (item.net_out || 0); });
          dayOut = Math.round(sumOutRate * (86400 / list.length));
        }

        if (typeof last.net_total_down === "number" && typeof first.net_total_down === "number" && last.net_total_down >= first.net_total_down) {
          dayIn = last.net_total_down - first.net_total_down;
        } else {
          let sumInRate = 0;
          list.forEach(item => { sumInRate += (item.net_in || 0); });
          dayIn = Math.round(sumInRate * (86400 / list.length));
        }

        result.push({
          date: dayStr,
          timestamp: new Date(dayStr + "T00:00:00Z").getTime(),
          in_bytes: Math.max(0, dayIn),
          out_bytes: Math.max(0, dayOut),
          total_bytes: Math.max(0, dayIn + dayOut),
        });
      }

      result.sort((a, b) => a.timestamp - b.timestamp);
      return result;
    }
    /**
     * 核心加载逻辑：从 Komari 核心接口拉取真实节点配置与真实历史时序打点
     */
    async function loadAllNodes() {
      try {
        // 1. 优先拉取核心管理客户端列表
        let coreClients = [];
        try {
          const clientRes = await fetch("/api/admin/client/list", { cache: "no-store" });
          if (clientRes.ok) {
            coreClients = await clientRes.json();
          }
        } catch (e) {
          try {
            const nodeRes = await fetch("/api/nodes", { cache: "no-store" });
            if (nodeRes.ok) {
              const nd = await nodeRes.json();
              coreClients = nd.data || nd;
            }
          } catch (e2) {}
        }

        if (!Array.isArray(coreClients) || coreClients.length === 0) {
          state.rawNodes = [];
          renderFilterBar();
          renderNodeCards();
          applyFilter();
          return;
        }

        // 2. 并发拉取各节点的实时上报状态 (/api/recent/:uuid) 与 30 天真实历史打点 (/api/records/load)
        const clientsWithHistory = await Promise.all(coreClients.map(async (client) => {
          let netTotalUp = Number(client.net_total_up || 0);
          let netTotalDown = Number(client.net_total_down || 0);
          let dailyHistory = [];

          // 优先从 /api/recent/:uuid 提取内存中最新的实时流量累计 (Komari 详情页 46.7G 所在的数据源)
          try {
            const recentRes = await fetch(`/api/recent/${encodeURIComponent(client.uuid)}`, { cache: "no-store" });
            if (recentRes.ok) {
              const recentJson = await recentRes.json();
              const recList = (recentJson.data && Array.isArray(recentJson.data)) ? recentJson.data : (Array.isArray(recentJson) ? recentJson : []);
              if (recList.length > 0) {
                const latest = recList[recList.length - 1];
                if (latest.network) {
                  netTotalUp = Number(latest.network.totalUp || latest.network.total_up || netTotalUp);
                  netTotalDown = Number(latest.network.totalDown || latest.network.total_down || netTotalDown);
                }
                if (typeof latest.net_total_up === "number") netTotalUp = latest.net_total_up;
                if (typeof latest.net_total_down === "number") netTotalDown = latest.net_total_down;
              }
            }
          } catch (e) {}

          // 从 /api/records/load 拉取过去 30 天网络打点并聚合每日增量
          try {
            const recRes = await fetch(`/api/records/load?uuid=${encodeURIComponent(client.uuid)}&load_type=network&hours=720`, { cache: "no-store" });
            if (recRes.ok) {
              const recJson = await recRes.json();
              const recList = (recJson.data && recJson.data.records) || recJson.records || [];
              if (Array.isArray(recList) && recList.length > 0) {
                dailyHistory = aggregateDailyFromRecords(recList);
                if (netTotalUp === 0 && netTotalDown === 0) {
                  const lastRec = recList[recList.length - 1];
                  if (typeof lastRec.net_total_up === "number") netTotalUp = lastRec.net_total_up;
                  if (typeof lastRec.net_total_down === "number") netTotalDown = lastRec.net_total_down;
                }
              }
            }
          } catch (err) {}

          return Object.assign({}, client, {
            net_total_up: netTotalUp,
            net_total_down: netTotalDown,
            daily_history: dailyHistory
          });
        }));

        // 3. 将真实历史与真实累计一并提交给插件后端进行科学推算
        const res = await fetch("/api/plugin/net-forecast/overview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ clients: clientsWithHistory })
        });

        const json = await res.json();
        if (json.ok && Array.isArray(json.nodes)) {
          state.rawNodes = json.nodes;
          renderFilterBar();
          renderNodeCards();
          applyFilter();
        }
      } catch (err) {
        console.error("Failed to load nodes from core:", err);
      }
    }

    // 绘制高分辨率 Retina Canvas 图表
    function drawNodeChart(node) {
      const canvas = document.getElementById(`chart-${node.node_id}`);
      const tooltip = document.getElementById(`tip-${node.node_id}`);
      const wrap = document.getElementById(`wrap-${node.node_id}`);
      if (!canvas || !wrap) return;

      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const rect = wrap.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);

      const pad = { top: 25, right: 65, bottom: 35, left: 65 };
      const chartW = w - pad.left - pad.right;
      const chartH = h - pad.top - pad.bottom;

      ctx.clearRect(0, 0, w, h);

      const items = node.chart_series || [];
      const count = items.length;
      if (count === 0) return;

      const modeKey = (node.traffic_limit_type || "sum").toLowerCase();

      // 双 Y 轴极值计算
      let maxBar = 0;
      let maxLine = 0;

      items.forEach((item) => {
        const barVal = (item.in_bytes || 0) + (item.out_bytes || 0);
        if (barVal > maxBar) maxBar = barVal;
        if (item.cumulative_billable && item.cumulative_billable > maxLine) {
          maxLine = item.cumulative_billable;
        }
      });

      maxBar = maxBar > 0 ? maxBar * 1.15 : 10 * GB;
      maxLine = maxLine > 0 ? maxLine * 1.15 : maxBar;

      // 绘制水平背景刻度线
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.lineWidth = 1;
      const steps = 4;

      for (let i = 0; i <= steps; i++) {
        const y = pad.top + (chartH / steps) * i;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + chartW, y);
        ctx.stroke();

        // 左 Y 轴刻度 (每日增量柱状图)
        const bVal = maxBar * (1 - i / steps);
        ctx.fillStyle = "rgba(148, 163, 184, 0.6)";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(formatBytes(bVal, 1), pad.left - 8, y + 3);

        // 右 Y 轴刻度 (累计折线)
        const lVal = maxLine * (1 - i / steps);
        ctx.fillStyle = "rgba(245, 158, 11, 0.75)";
        ctx.textAlign = "left";
        ctx.fillText(formatBytes(lVal, 1), pad.left + chartW + 8, y + 3);
      }

      const stepX = chartW / count;
      const barW = Math.max(3, Math.min(22, stepX * 0.58));
      const screenPts = [];

      // 1. 绘制堆叠柱状图 (入站 + 出站)，根据当前计费模式进行高亮与弱化透明度调整
      items.forEach((item, idx) => {
        const cx = pad.left + stepX * idx + stepX / 2;
        const inBytes = item.in_bytes || 0;
        const outBytes = item.out_bytes || 0;

        const inH = (inBytes / maxBar) * chartH;
        const outH = (outBytes / maxBar) * chartH;
        const baseY = pad.top + chartH;

        let inAlpha = 0.85;
        let outAlpha = 0.85;

        if (modeKey === "upload" || modeKey === "up") {
          inAlpha = 0.28;
          outAlpha = 0.95;
        } else if (modeKey === "download" || modeKey === "down") {
          inAlpha = 0.95;
          outAlpha = 0.28;
        } else if (modeKey === "max") {
          if (inBytes > outBytes) {
            inAlpha = 0.95;
            outAlpha = 0.35;
          } else {
            inAlpha = 0.35;
            outAlpha = 0.95;
          }
        } else if (modeKey === "min") {
          if (inBytes < outBytes) {
            inAlpha = 0.95;
            outAlpha = 0.35;
          } else {
            inAlpha = 0.35;
            outAlpha = 0.95;
          }
        }

        if (item.is_forecast) {
          inAlpha *= 0.35;
          outAlpha *= 0.35;
        }

        // 入站柱 (底层)
        const inY = baseY - inH;
        ctx.globalAlpha = inAlpha;
        ctx.fillStyle = "#6366f1";
        ctx.fillRect(cx - barW / 2, inY, barW, inH);

        // 出站柱 (堆叠在入站之上)
        const outY = inY - outH;
        ctx.globalAlpha = outAlpha;
        ctx.fillStyle = "#10b981";
        ctx.fillRect(cx - barW / 2, outY, barW, outH);

        ctx.globalAlpha = 1.0;

        // X 轴日期刻度
        if (idx % Math.ceil(count / 10) === 0 || idx === count - 1) {
          ctx.fillStyle = item.is_forecast ? "rgba(251, 146, 60, 0.85)" : "rgba(148, 163, 184, 0.75)";
          ctx.font = "10px sans-serif";
          ctx.textAlign = "center";
          let lbl = item.date || "";
          if (lbl.length > 5) lbl = lbl.slice(5);
          ctx.fillText(lbl, cx, baseY + 16);
        }

        screenPts.push({ x: cx, y: outY, item: item });
      });

      // 2. 绘制累计折线 (实线) 与外推走势 (虚线)
      const actualPts = [];
      const forecastPts = [];

      items.forEach((item, idx) => {
        const cx = pad.left + stepX * idx + stepX / 2;
        const cum = item.cumulative_billable || 0;
        const cy = pad.top + chartH - (cum / maxLine) * chartH;

        if (item.is_forecast) {
          if (forecastPts.length === 0 && actualPts.length > 0) {
            forecastPts.push(actualPts[actualPts.length - 1]);
          }
          forecastPts.push({ x: cx, y: cy });
        } else {
          actualPts.push({ x: cx, y: cy });
        }
      });

      // 实线部分
      if (actualPts.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 2.2;
        ctx.setLineDash([]);
        actualPts.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        actualPts.forEach((pt) => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = "#f59e0b";
          ctx.fill();
        });
      }

      // 虚线预测部分
      if (forecastPts.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = "#fb923c";
        ctx.lineWidth = 2.2;
        ctx.setLineDash([4, 4]);
        forecastPts.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
        ctx.setLineDash([]);

        forecastPts.forEach((pt) => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);
          ctx.fillStyle = "#fb923c";
          ctx.fill();
        });
      }

      // Tooltip 交互监听
      canvas.onmousemove = (e) => {
        const b = canvas.getBoundingClientRect();
        const mx = e.clientX - b.left;
        let closest = null;
        let minDist = Infinity;

        screenPts.forEach((pt) => {
          const dist = Math.abs(pt.x - mx);
          if (dist < minDist && dist < 25) {
            minDist = dist;
            closest = pt;
          }
        });

        if (closest) {
          const it = closest.item;
          tooltip.style.display = "block";
          tooltip.style.left = Math.min(w - 200, Math.max(10, closest.x - 90)) + "px";
          tooltip.style.top = Math.max(8, closest.y - 110) + "px";

          tooltip.innerHTML = `
            <div class="tooltip-title">${it.date} ${it.is_forecast ? '<span style="color:#fb923c;">(预测)</span>' : ''}</div>
            <div class="tooltip-row"><span style="color:var(--inbound);">● 入站增量:</span> <span>${formatBytes(it.in_bytes)}</span></div>
            <div class="tooltip-row"><span style="color:var(--outbound);">● 出站增量:</span> <span>${formatBytes(it.out_bytes)}</span></div>
            <div class="tooltip-row"><span>● 物理合计:</span> <span>${formatBytes(it.total_bytes)}</span></div>
            <div class="tooltip-row" style="border-top:1px dashed rgba(255,255,255,0.15); padding-top:4px; margin-top:5px;">
              <span style="color:var(--cumulative);">● 计费累计:</span>
              <strong style="color:var(--cumulative);">${formatBytes(it.cumulative_billable)}</strong>
            </div>
          `;
        } else {
          tooltip.style.display = "none";
        }
      };

      canvas.onmouseleave = () => {
        tooltip.style.display = "none";
      };
    }

    // 过滤卡片展示
    function applyFilter() {
      const cards = document.querySelectorAll(".node-card");

      const empty = document.getElementById("emptyState");
      if (visibleCount === 0) {
        empty.style.display = "block";
      } else {
        empty.style.display = "none";
      }
    }

    /**
     * 保存限额设置：直接写入 Komari 核心数据库，插件不作任何本地设置缓存
     */
    async function saveNodeModal() {
      if (!state.editingNodeId) return;

      const saveBtn = document.getElementById("btnSaveNodeModal");
      saveBtn.disabled = true;
      saveBtn.textContent = "正在写入核心数据库...";

      const quotaGB = parseFloat(document.getElementById("modalQuotaGB").value) || 0;
      const quotaBytes = Math.round(quotaGB * GB);
      const mode = document.getElementById("modalTrafficMode").value;

      try {
        // 1. 直写 Komari 核心管理接口 (POST /api/admin/client/:uuid/edit)
        let coreSuccess = false;
        try {
          const coreEditRes = await fetch(`/api/admin/client/${encodeURIComponent(state.editingNodeId)}/edit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              traffic_limit: quotaBytes,
              traffic_limit_type: mode
            })
          });
          if (coreEditRes.ok) {
            coreSuccess = true;
          }
        } catch (coreErr) {
          console.warn("Direct core API call notice:", coreErr);
        }

        // 2. 同时通知插件后端 (触发服务端 RPC 调用，双重保障直通核心数据库)
        try {
          await fetch("/api/plugin/net-forecast/update-quota", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              uuid: state.editingNodeId,
              traffic_limit: quotaBytes,
              traffic_limit_type: mode
            })
          });
        } catch (pluginErr) {
          console.warn("Plugin proxy notice:", pluginErr);
        }

        closeNodeModal();

        // 3. 立即从核心重新拉取最新数据并重新推算展示，不依赖任何本地缓存
        await loadAllNodes();
      } catch (e) {
        alert("写入失败：" + (e.message || String(e)));
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "保存并写入数据库";
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadAllNodes();

      document.getElementById("btnRefresh").addEventListener("click", () => {
        loadAllNodes();
      });

      window.addEventListener("resize", () => {
        state.rawNodes.forEach((node) => {
          drawNodeChart(node);
        });
      });
    });
  </script>
</body>
</html>
