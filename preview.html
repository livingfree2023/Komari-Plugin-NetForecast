<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetForecast 全节点流量预测总览 (Mockup Preview)</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --inbound: #6366f1;
      --outbound: #10b981;
      --cumulative: #f59e0b;
      --forecast-line: #fb923c;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.16);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.16);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.16);
      --neutral-badge: rgba(148, 163, 184, 0.15);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* 顶部提示栏 */
    .preview-tip {
      background: rgba(99, 102, 241, 0.15);
      border: 1px dashed rgba(99, 102, 241, 0.4);
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      color: #c7d2fe;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .preview-tip strong {
      color: #fff;
    }

    /* 顶部总览状态头 */
    .header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      padding: 20px 26px;
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .title-icon {
      font-size: 26px;
      background: rgba(99, 102, 241, 0.25);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.4);
      box-shadow: 0 0 18px rgba(99, 102, 241, 0.2);
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .stats-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .summary-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .badge-critical {
      background: var(--danger-bg);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .badge-warning {
      background: var(--warning-bg);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .badge-safe {
      background: var(--success-bg);
      border-color: rgba(16, 185, 129, 0.3);
      color: #a7f3d0;
    }

    .badge-neutral {
      background: var(--neutral-badge);
      border-color: rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
    }

    /* 节点卡片列表 */
    .nodes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .node-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 18px;
      transition: border-color 0.2s ease;
    }

    .node-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
    }

    /* 节点卡片头部 */
    .node-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .node-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .node-name {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .node-quota-meta {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.7);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    /* 告警横幅（仅在节点配置了配额且超限/预警时展示） */
    .node-alert-banner {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    .node-alert-banner.critical {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .node-alert-banner.warning {
      background: var(--warning-bg);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .node-alert-banner strong {
      color: #fff;
    }

    /* 统计指标行 */
    .node-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .node-kpi-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .kpi-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: flex;
      justify-content: space-between;
    }

    .kpi-number {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .kpi-detail {
      font-size: 12px;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--inbound);
      border-radius: 3px;
    }

    .progress-bar-fill.critical {
      background: var(--danger);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
    }

    .progress-bar-fill.warning {
      background: var(--warning);
    }

    /* 图表区域 */
    .chart-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chart-sub-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 11px;
      height: 11px;
      border-radius: 3px;
    }

    .legend-line {
      width: 16px;
      height: 3px;
      border-radius: 2px;
    }

    .legend-line.dashed {
      border-top: 2px dashed var(--forecast-line);
      height: 0;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 280px;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 10px;
      padding: 10px 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tooltip {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 12px;
      color: #fff;
      pointer-events: none;
      display: none;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      min-width: 175px;
    }

    .tooltip-title {
      font-weight: 600;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 需求变更提示 -->
    <div class="preview-tip">
      <span>💡 <strong>全节点平铺预览 (30天周期)</strong>：已按你的最新要求调整 — 默认统一以 <strong>最近 30 天</strong> 展示所有节点图表，取消了 1/7/30 切换；配额直接读取自节点自身设置，无内置默认配额。</span>
      <span>第四个节点演示<strong>未配置配额</strong>场景（不进行超限告警，但预测能力完全保留）。</span>
    </div>

    <!-- 顶部总览状态 -->
    <header class="header-bar">
      <div class="title-group">
        <div class="title-icon">📊</div>
        <div>
          <h1>节点网络流量预测与限额预警 (NetForecast)</h1>
          <div class="subtitle">所有节点 30 天流量新增堆叠柱状图 / 当月累计折线 / 周期重置日流量耗尽推算</div>
        </div>
      </div>
      <div class="stats-summary" id="globalStatsSummary">
        <!-- 动态汇总数据 -->
      </div>
    </header>

    <!-- 所有节点图表列表容器 -->
    <main class="nodes-container" id="nodesContainer"></main>
  </div>

  <script>
    const GB = 1024 * 1024 * 1024;

    function formatBytes(bytes, decimals = 2) {
      if (!bytes || bytes === 0) return "0 B";
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ["B", "KB", "MB", "GB", "TB", "PB"];
      const i = Math.floor(Math.log(Math.abs(bytes)) / Math.log(k));
      const idx = Math.min(i, sizes.length - 1);
      return parseFloat((bytes / Math.pow(k, idx)).toFixed(dm)) + " " + sizes[idx];
    }

    /**
     * Mock 节点配置数据（模拟直接从 Komari 节点自身字段读取）
     * - quota_bytes: 节点自身的 traffic_limit，为 0 或 undefined 表示未配置限额
     * - reset_day: 节点自身的 traffic_reset_day，为 0 或 undefined 时按自然月(1号)重置
     */
    const MOCK_NODES = [
      {
        node_id: "tokyo-prod-01",
        node_name: "🇯🇵 日本东京 (Tokyo-01)",
        has_quota: true,
        quota_bytes: 1000 * GB, // 节点设置中配置了 1000 GB
        reset_day: 1, // 每月 1 号重置
        daily_base_gb: 34,
        weekend_boost: 1.5,
        inbound_ratio: 0.38
      },
      {
        node_id: "us-west-02",
        node_name: "🇺🇸 美西硅谷 (US-West-02)",
        has_quota: true,
        quota_bytes: 2000 * GB, // 节点设置中配置了 2000 GB
        reset_day: 15, // 每月 15 号重置
        daily_base_gb: 22,
        weekend_boost: 1.2,
        inbound_ratio: 0.42
      },
      {
        node_id: "eu-central-03",
        node_name: "🇩🇪 德国法兰克福 (Frankfurt-03)",
        has_quota: true,
        quota_bytes: 500 * GB, // 节点设置中配置了 500 GB
        reset_day: 5, // 每月 5 号重置
        daily_base_gb: 16,
        weekend_boost: 1.1,
        inbound_ratio: 0.46
      },
      {
        node_id: "singapore-edge-04",
        node_name: "🇸🇬 新加坡测试节点 (Singapore-04 · 未设限额)",
        has_quota: false,
        quota_bytes: 0, // 节点设置未配置流量限额
        reset_day: 1, // 按自然月周期推算预测
        daily_base_gb: 19,
        weekend_boost: 1.3,
        inbound_ratio: 0.40
      }
    ];

    // 生成过去 30 天的历史增量数据
    function generateNodeHistory(node) {
      const records = [];
      const now = new Date();

      for (let i = 30; i >= 0; i--) {
        const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
        const dateStr = d.toISOString().split("T")[0];
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const wave = ((i * 7) % 15 - 7) / 100;
        const dayTotalGB = node.daily_base_gb * (isWeekend ? node.weekend_boost : 0.95) * (1 + wave);
        const totalBytes = Math.round(dayTotalGB * GB);
        const inBytes = Math.round(totalBytes * node.inbound_ratio);
        const outBytes = totalBytes - inBytes;

        records.push({
          date: dateStr,
          timestamp: d.getTime(),
          in_bytes: inBytes,
          out_bytes: outBytes,
          total_bytes: totalBytes
        });
      }
      return records;
    }

    // 周期与预测推算
    function computeForecast(history, node, now = new Date()) {
      const year = now.getFullYear();
      const month = now.getMonth();
      const date = now.getDate();
      const resetDay = Math.max(1, Math.min(31, node.reset_day || 1));

      let cycleStart, cycleEnd;
      if (date >= resetDay) {
        cycleStart = new Date(year, month, resetDay, 0, 0, 0, 0);
        cycleEnd = new Date(month === 11 ? year + 1 : year, month === 11 ? 0 : month + 1, resetDay, 0, 0, 0, 0);
      } else {
        cycleStart = new Date(month === 0 ? year - 1 : year, month === 0 ? 11 : month - 1, resetDay, 0, 0, 0, 0);
        cycleEnd = new Date(year, month, resetDay, 0, 0, 0, 0);
      }

      const oneDay = 24 * 3600 * 1000;
      const daysTotal = Math.max(1, Math.round((cycleEnd.getTime() - cycleStart.getTime()) / oneDay));
      const daysElapsed = Math.max(1, Math.min(daysTotal, Math.ceil((now.getTime() - cycleStart.getTime()) / oneDay)));
      const daysRemaining = Math.max(0, daysTotal - daysElapsed);

      let cumulativeIn = 0;
      let cumulativeOut = 0;
      history.forEach((r) => {
        if (r.timestamp >= cycleStart.getTime() && r.timestamp <= now.getTime()) {
          cumulativeIn += r.in_bytes;
          cumulativeOut += r.out_bytes;
        }
      });
      const cumulativeTotal = cumulativeIn + cumulativeOut;

      // 7 日加权均值
      const recent = history.slice(-7);
      let weightSum = 0, wInSum = 0, wOutSum = 0;
      recent.forEach((r, idx) => {
        const w = 1 + (idx / recent.length) * 1.2;
        wInSum += r.in_bytes * w;
        wOutSum += r.out_bytes * w;
        weightSum += w;
      });
      const dailyAvgIn = Math.round(wInSum / weightSum);
      const dailyAvgOut = Math.round(wOutSum / weightSum);
      const dailyAvgTotal = dailyAvgIn + dailyAvgOut;

      const projectedIn = cumulativeIn + dailyAvgIn * daysRemaining;
      const projectedOut = cumulativeOut + dailyAvgOut * daysRemaining;
      const projectedTotal = cumulativeTotal + dailyAvgTotal * daysRemaining;

      const hasQuota = Boolean(node.has_quota && node.quota_bytes > 0);
      let status = "NO_QUOTA"; // 如果节点没有配置限额，状态为 NO_QUOTA
      let warningMessage = null;

      if (hasQuota) {
        const quota = node.quota_bytes;
        const ratio = projectedTotal / quota;

        if (cumulativeTotal >= quota) {
          status = "CRITICAL";
          warningMessage = `已超出节点配置的流量限额 (${formatBytes(cumulativeTotal)} / ${formatBytes(quota)})，超额 ${formatBytes(cumulativeTotal - quota)}！`;
        } else if (ratio >= 1.0) {
          status = "CRITICAL";
          const remainQuota = quota - cumulativeTotal;
          const daysUntilExhaustion = Math.max(1, Math.floor(remainQuota / dailyAvgTotal));
          const exDateObj = new Date(now.getTime() + daysUntilExhaustion * oneDay);
          const exhaustionDate = exDateObj.toISOString().split("T")[0];
          const overage = projectedTotal - quota;
          warningMessage = `预计将在 <strong>${daysUntilExhaustion} 天后</strong>（${exhaustionDate}）耗尽节点配置的流量限额，重置日前预计超标 <strong>${formatBytes(overage)}</strong>！`;
        } else if (ratio >= 0.9) {
          status = "WARNING";
          warningMessage = `预计在重置日将消耗 <strong>${(ratio * 100).toFixed(1)}%</strong> 的流量，接近告警阈值 (90%)。`;
        } else {
          status = "SAFE";
          warningMessage = `流量处于安全预算内，预计重置日使用率为 <strong>${(ratio * 100).toFixed(1)}%</strong>，剩余可用 <strong>${formatBytes(quota - projectedTotal)}</strong>。`;
        }
      }

      return {
        hasQuota,
        quota_bytes: node.quota_bytes,
        cycle: {
          startStr: cycleStart.toISOString().split("T")[0],
          endStr: cycleEnd.toISOString().split("T")[0],
          cycleStart,
          cycleEnd,
          daysTotal,
          daysElapsed,
          daysRemaining
        },
        cumulative: {
          in_bytes: cumulativeIn,
          out_bytes: cumulativeOut,
          total_bytes: cumulativeTotal
        },
        daily_avg: {
          in_bytes: dailyAvgIn,
          out_bytes: dailyAvgOut,
          total_bytes: dailyAvgTotal
        },
        projected: {
          in_bytes: projectedIn,
          out_bytes: projectedOut,
          total_bytes: projectedTotal
        },
        usage_ratio: hasQuota ? projectedTotal / node.quota_bytes : 0,
        status,
        warning_message: warningMessage
      };
    }

    // 构建 30 天序列与未来预测序列
    function build30DaySeries(history, forecast) {
      const display = history.slice(-30);
      let runningCum = 0;
      const cycleStartMs = forecast.cycle.cycleStart.getTime();

      const points = display.map((item) => {
        if (item.timestamp >= cycleStartMs) {
          runningCum += item.total_bytes;
        }
        return {
          date: item.date,
          timestamp: item.timestamp,
          in_bytes: item.in_bytes,
          out_bytes: item.out_bytes,
          total_bytes: item.total_bytes,
          cumulative_bytes: runningCum,
          is_forecast: false
        };
      });

      // 叠加到达重置日的预测虚线
      if (forecast.cycle.daysRemaining > 0) {
        let fCum = runningCum;
        const now = new Date();
        const fDays = Math.min(forecast.cycle.daysRemaining, 14);

        for (let i = 1; i <= fDays; i++) {
          const fd = new Date(now.getTime() + i * 24 * 3600 * 1000);
          fCum += forecast.daily_avg.total_bytes;
          points.push({
            date: fd.toISOString().split("T")[0],
            timestamp: fd.getTime(),
            in_bytes: forecast.daily_avg.in_bytes,
            out_bytes: forecast.daily_avg.out_bytes,
            total_bytes: forecast.daily_avg.total_bytes,
            cumulative_bytes: fCum,
            is_forecast: true
          });
        }
      }

      return points;
    }

    // 渲染页面
    function renderPage() {
      const container = document.getElementById("nodesContainer");
      container.innerHTML = "";

      let criticalCount = 0;
      let warningCount = 0;
      let safeCount = 0;
      let noQuotaCount = 0;

      MOCK_NODES.forEach((node, nodeIdx) => {
        const history = generateNodeHistory(node);
        const forecast = computeForecast(history, node);
        const series = build30DaySeries(history, forecast);

        if (forecast.status === "CRITICAL") criticalCount++;
        else if (forecast.status === "WARNING") warningCount++;
        else if (forecast.status === "SAFE") safeCount++;
        else noQuotaCount++;

        // 创建节点卡片 DOM
        const card = document.createElement("section");
        card.className = "node-card";
        card.id = `card-${node.node_id}`;

        // 状态徽标与限额信息
        let badgeHtml = "";
        let alertBannerHtml = "";

        if (!forecast.hasQuota) {
          badgeHtml = `<span class="summary-badge badge-neutral">⚪ 未配置限额 (保留预测)</span>`;
        } else if (forecast.status === "CRITICAL") {
          badgeHtml = `<span class="summary-badge badge-critical">🚨 超限预警</span>`;
          alertBannerHtml = `
            <div class="node-alert-banner critical">
              <span>⚠️</span>
              <div>${forecast.warning_message}</div>
            </div>`;
        } else if (forecast.status === "WARNING") {
          badgeHtml = `<span class="summary-badge badge-warning">⚡ 接近限额 (90%+)</span>`;
          alertBannerHtml = `
            <div class="node-alert-banner warning">
              <span>⚡</span>
              <div>${forecast.warning_message}</div>
            </div>`;
        } else {
          badgeHtml = `<span class="summary-badge badge-safe">✅ 预算安全</span>`;
        }

        // 配额进度条 HTML
        let quotaInfoHtml = "";
        if (forecast.hasQuota) {
          const ratioPercent = Math.min(100, Math.round(forecast.usage_ratio * 100));
          const fillClass = forecast.status === "CRITICAL" ? "critical" : forecast.status === "WARNING" ? "warning" : "";
          quotaInfoHtml = `
            <div class="kpi-detail">限额: ${formatBytes(forecast.quota_bytes)} (预测占比 ${ratioPercent}%)</div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill ${fillClass}" style="width: ${ratioPercent}%;"></div>
            </div>
          `;
        } else {
          quotaInfoHtml = `
            <div class="kpi-detail" style="color: var(--text-muted); opacity: 0.85;">未配置限额 (不执行告警)</div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 100%; opacity: 0.25;"></div></div>
          `;
        }

        card.innerHTML = `
          <div class="node-header">
            <div class="node-title-wrap">
              <div class="node-name">${node.node_name}</div>
              <div class="node-quota-meta">
                ${forecast.hasQuota ? `限额: ${formatBytes(forecast.quota_bytes)} · 每月 ${node.reset_day} 号重置` : `不限额 · 每月 ${node.reset_day} 号重置`}
              </div>
            </div>
            <div>${badgeHtml}</div>
          </div>

          ${alertBannerHtml}

          <div class="node-kpi-grid">
            <div class="node-kpi-item">
              <div class="kpi-title">
                <span>当月已用流量 (累计)</span>
                <span style="color: var(--cumulative);">● 累计</span>
              </div>
              <div class="kpi-number">${formatBytes(forecast.cumulative.total_bytes)}</div>
              <div class="kpi-detail">入: ${formatBytes(forecast.cumulative.in_bytes)} | 出: ${formatBytes(forecast.cumulative.out_bytes)}</div>
            </div>

            <div class="node-kpi-item">
              <div class="kpi-title">
                <span>日均消耗速率 (7日加权)</span>
                <span>📈 均速</span>
              </div>
              <div class="kpi-number">${formatBytes(forecast.daily_avg.total_bytes)} / 天</div>
              <div class="kpi-detail">入: ${formatBytes(forecast.daily_avg.in_bytes)}/天 | 出: ${formatBytes(forecast.daily_avg.out_bytes)}/天</div>
            </div>

            <div class="node-kpi-item">
              <div class="kpi-title">
                <span>计费周期与重置</span>
                <span>${forecast.cycle.daysRemaining} 天后</span>
              </div>
              <div class="kpi-number">${forecast.cycle.daysRemaining} 天后重置</div>
              <div class="kpi-detail">${forecast.cycle.startStr} ~ ${forecast.cycle.endStr} (已过 ${forecast.cycle.daysElapsed} 天)</div>
            </div>

            <div class="node-kpi-item">
              <div class="kpi-title">
                <span>预测到达重置日总消耗</span>
                <span>${forecast.hasQuota ? '含配额推算' : '无配额预测'}</span>
              </div>
              <div class="kpi-number" style="${forecast.status === 'CRITICAL' ? 'color: var(--danger);' : ''}">
                ${formatBytes(forecast.projected.total_bytes)}
              </div>
              ${quotaInfoHtml}
            </div>
          </div>

          <div class="chart-box">
            <div class="chart-sub-header">
              <span>最近 30 天每日进出站流量增量与当月累计趋势</span>
              <div class="chart-legend">
                <div class="legend-item">
                  <div class="legend-color" style="background: var(--inbound);"></div>
                  <span>入站新增 (Inbound)</span>
                </div>
                <div class="legend-item">
                  <div class="legend-color" style="background: var(--outbound);"></div>
                  <span>出站新增 (Outbound)</span>
                </div>
                <div class="legend-item">
                  <div class="legend-line" style="background: var(--cumulative);"></div>
                  <span>当月累计流量 (Cycle Total)</span>
                </div>
                <div class="legend-item">
                  <div class="legend-line dashed"></div>
                  <span>未来预测走势 (Forecast)</span>
                </div>
              </div>
            </div>

            <div class="canvas-wrapper" id="wrapper-${node.node_id}">
              <canvas id="canvas-${node.node_id}"></canvas>
              <div class="tooltip" id="tooltip-${node.node_id}"></div>
            </div>
          </div>
        `;

        container.appendChild(card);

        // 渲染专属 Canvas 图表
        setTimeout(() => {
          renderNodeChart(node.node_id, series);
        }, 0);
      });

      // 渲染顶部全局状态栏
      const summaryBar = document.getElementById("globalStatsSummary");
      summaryBar.innerHTML = `
        <span class="summary-badge badge-neutral">节点总数: ${MOCK_NODES.length}</span>
        ${criticalCount > 0 ? `<span class="summary-badge badge-critical">🚨 ${criticalCount} 个超限告警</span>` : ''}
        ${warningCount > 0 ? `<span class="summary-badge badge-warning">⚡ ${warningCount} 个接近限额</span>` : ''}
        ${safeCount > 0 ? `<span class="summary-badge badge-safe">✅ ${safeCount} 个预算安全</span>` : ''}
        ${noQuotaCount > 0 ? `<span class="summary-badge badge-neutral">⚪ ${noQuotaCount} 个未配额 (仅预测)</span>` : ''}
      `;
    }

    // 绘制单个节点的专属复合图表
    function renderNodeChart(nodeId, items) {
      const canvas = document.getElementById(`canvas-${nodeId}`);
      const wrapper = document.getElementById(`wrapper-${nodeId}`);
      const tooltip = document.getElementById(`tooltip-${nodeId}`);
      if (!canvas || !wrapper) return;

      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const rect = wrapper.getBoundingClientRect();

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;
      const padding = { top: 20, right: 65, bottom: 32, left: 65 };
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;

      ctx.clearRect(0, 0, width, height);

      const count = items.length;
      let maxBar = 0, maxLine = 0;

      items.forEach((item) => {
        const barSum = (item.in_bytes || 0) + (item.out_bytes || 0);
        if (barSum > maxBar) maxBar = barSum;
        if (item.cumulative_bytes && item.cumulative_bytes > maxLine) maxLine = item.cumulative_bytes;
      });

      maxBar = maxBar > 0 ? maxBar * 1.15 : 10 * GB;
      maxLine = maxLine > 0 ? maxLine * 1.15 : maxBar;

      // 网格刻度线
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.lineWidth = 1;
      const gridSteps = 4;

      for (let i = 0; i <= gridSteps; i++) {
        const y = padding.top + (chartH / gridSteps) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(padding.left + chartW, y);
        ctx.stroke();

        const barVal = maxBar * (1 - i / gridSteps);
        ctx.fillStyle = "rgba(148, 163, 184, 0.75)";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(formatBytes(barVal, 1), padding.left - 8, y + 3);

        const lineVal = maxLine * (1 - i / gridSteps);
        ctx.textAlign = "left";
        ctx.fillStyle = "rgba(245, 158, 11, 0.85)";
        ctx.fillText(formatBytes(lineVal, 1), padding.left + chartW + 8, y + 3);
      }

      const stepX = chartW / count;
      const barWidth = Math.max(4, Math.min(22, stepX * 0.55));
      const screenPoints = [];

      // 1. 堆叠柱状图
      items.forEach((item, index) => {
        const cx = padding.left + stepX * index + stepX / 2;
        const inBytes = item.in_bytes || 0;
        const outBytes = item.out_bytes || 0;

        const inH = (inBytes / maxBar) * chartH;
        const outH = (outBytes / maxBar) * chartH;
        const baseGroundY = padding.top + chartH;

        ctx.globalAlpha = item.is_forecast ? 0.35 : 0.92;

        const inY = baseGroundY - inH;
        ctx.fillStyle = "#6366f1";
        ctx.fillRect(cx - barWidth / 2, inY, barWidth, inH);

        const outY = inY - outH;
        ctx.fillStyle = "#10b981";
        ctx.fillRect(cx - barWidth / 2, outY, barWidth, outH);

        ctx.globalAlpha = 1.0;

        // X 轴日期
        if (index % Math.ceil(count / 10) === 0 || index === count - 1) {
          ctx.fillStyle = item.is_forecast ? "rgba(251, 146, 60, 0.85)" : "rgba(148, 163, 184, 0.8)";
          ctx.font = "10px sans-serif";
          ctx.textAlign = "center";
          let label = item.date;
          if (label && label.length > 5) label = label.slice(5);
          ctx.fillText(label, cx, baseGroundY + 16);
        }

        screenPoints.push({
          x: cx,
          y: outY,
          item: item
        });
      });

      // 2. 累计实线与预测虚线
      const actualPoints = [];
      const forecastPoints = [];

      items.forEach((item, index) => {
        const cx = padding.left + stepX * index + stepX / 2;
        const cumBytes = item.cumulative_bytes || 0;
        const cy = padding.top + chartH - (cumBytes / maxLine) * chartH;

        if (item.is_forecast) {
          if (forecastPoints.length === 0 && actualPoints.length > 0) {
            forecastPoints.push(actualPoints[actualPoints.length - 1]);
          }
          forecastPoints.push({ x: cx, y: cy });
        } else {
          actualPoints.push({ x: cx, y: cy });
        }
      });

      if (actualPoints.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 2.4;
        ctx.setLineDash([]);
        actualPoints.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        actualPoints.forEach((pt) => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = "#f59e0b";
          ctx.fill();
        });
      }

      if (forecastPoints.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = "#fb923c";
        ctx.lineWidth = 2.4;
        ctx.setLineDash([4, 4]);
        forecastPoints.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
        ctx.setLineDash([]);

        forecastPoints.forEach((pt) => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);
          ctx.fillStyle = "#fb923c";
          ctx.fill();
        });
      }

      // 绑定每个卡片的鼠标悬浮交互
      canvas.onmousemove = (e) => {
        const cRect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - cRect.left;

        let closest = null;
        let minDist = Infinity;

        screenPoints.forEach((pt) => {
          const dist = Math.abs(pt.x - mouseX);
          if (dist < minDist && dist < 24) {
            minDist = dist;
            closest = pt;
          }
        });

        if (closest) {
          const item = closest.item;
          tooltip.style.display = "block";
          tooltip.style.left = Math.min(rect.width - 190, Math.max(10, closest.x - 85)) + "px";
          tooltip.style.top = Math.max(10, closest.y - 100) + "px";

          tooltip.innerHTML = `
            <div class="tooltip-title">${item.date} ${item.is_forecast ? '<span style="color:#fb923c; font-size:11px;">(未来预测)</span>' : ''}</div>
            <div class="tooltip-row"><span style="color:var(--inbound);">● 入站增量:</span> <span>${formatBytes(item.in_bytes)}</span></div>
            <div class="tooltip-row"><span style="color:var(--outbound);">● 出站增量:</span> <span>${formatBytes(item.out_bytes)}</span></div>
            <div class="tooltip-row"><span>● 当日总计:</span> <strong>${formatBytes(item.total_bytes)}</strong></div>
            <div class="tooltip-row" style="border-top:1px dashed rgba(255,255,255,0.15); padding-top:4px; margin-top:5px;">
              <span style="color:var(--cumulative);">● 当月累计:</span> 
              <strong style="color:var(--cumulative);">${formatBytes(item.cumulative_bytes)}</strong>
            </div>
          `;
        } else {
          tooltip.style.display = "none";
        }
      };

      canvas.onmouseleave = () => {
        tooltip.style.display = "none";
      };
    }

    window.addEventListener("DOMContentLoaded", renderPage);
    window.addEventListener("resize", () => {
      MOCK_NODES.forEach((node) => {
        const history = generateNodeHistory(node);
        const forecast = computeForecast(history, node);
        const series = build30DaySeries(history, forecast);
        renderNodeChart(node.node_id, series);
      });
    });
  </script>
</body>
